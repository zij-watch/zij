<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320">
  <!-- Paper grain: fine tooth plus slow mottling, grey around 50%, drawn in code. Tile it and blend with multiply at the grain opacity. -->
  <filter id="paper" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="11" stitchTiles="stitch" result="tooth"/>
    <feTurbulence type="fractalNoise" baseFrequency="0.018 0.03" numOctaves="3" seed="4" stitchTiles="stitch" result="mottle"/>
    <feTurbulence type="fractalNoise" baseFrequency="0.006 0.22" numOctaves="2" seed="23" stitchTiles="stitch" result="fibre"/>
    <feComposite in="tooth" in2="mottle" operator="arithmetic" k1="0" k2="0.55" k3="0.45" k4="0" result="a"/>
    <feComposite in="a" in2="fibre" operator="arithmetic" k1="0" k2="0.8" k3="0.2" k4="0" result="b"/>
    <feColorMatrix in="b" type="matrix" values="0.4 0.4 0.2 0 0  0.4 0.4 0.2 0 0  0.4 0.4 0.2 0 0  0 0 0 0 1"/>
  </filter>
  <rect width="320" height="320" filter="url(#paper)"/>
</svg>
