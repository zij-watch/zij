<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 472" width="960" height="472" role="img" aria-labelledby="t d" font-family="Georgia, 'Times New Roman', serif">
<title id="t">Season error by model, both tests</title>
<desc id="d">Mean absolute error of the season total. Raw MODIS, no calibration: 76.5% leaving one year out, 74.6% on 2021 to 2025. M0: one fixed multiplier: 24.1% leaving one year out, 36.6% on 2021 to 2025. M1: c + a M^b: 19.1% leaving one year out, 33.5% on 2021 to 2025. M2: M1 with a background per month: 19.6% leaving one year out, 33.2% on 2021 to 2025. M3: M2 with fire size: 16.6% leaving one year out, 27.2% on 2021 to 2025. M4: M3 with the background scaled by the year's activity: 14.2% leaving one year out, 25.2% on 2021 to 2025.</desc>
<defs><pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="5" stroke="#4a3c2a" stroke-width="1.5"/></pattern></defs>
